[package]
name = "wingsvpn-federation-pay"
version = "0.1.0"
edition = "2021"
description = "Деньги федерации WINGS V: казна, эпохи выплат, стейк доноров"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "4"
solana-security-txt = "1.1.3"

[dev-dependencies]
solana-sdk = "4"

# Программа платит за свой размер рентой, причём навсегда: каждый лишний
# килобайт это вычет из казны доноров, поэтому жмём в размер, а не в скорость
[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"

# Макрос entrypoint! из solana-program сам городит cfg под sbf-цель, и на хосте
# компилятор про них не знает. Ругань его законна, но чинить нечего нахуй
[lints.rust]
unexpected_cfgs = { level = "allow" }
